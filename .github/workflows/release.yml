name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Decide whether to release ────────────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag:     ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Decide whether to release
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Tag push — releasing."
            echo "release=true"  >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists — no bump, skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New version $TAG — tagging and releasing."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

  # ── Build sphere CLI — macOS arm64 ───────────────────────────────────────────
  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install cython setuptools wheel pyinstaller
          pip install -e ".[fast]"
          pip install polars pyarrow

      - name: Build CLI binary
        run: bash build.sh

      - name: Package tarball + installer
        run: |
          cd dist
          cp ../install.sh .
          tar -czf sphere-cli-macos-arm64.tar.gz sphere-cli install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          path: dist/sphere-cli-macos-arm64.tar.gz

  # ── Build sphere CLI — Linux x86_64 ─────────────────────────────────────────
  build-linux-x86_64:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf upx-ucl

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install cython setuptools wheel pyinstaller
          pip install -e ".[fast]"
          pip install polars pyarrow

      - name: Build CLI binary
        run: bash build.sh

      - name: Package tarball + installer
        run: |
          cd dist
          cp ../install.sh .
          tar -czf sphere-cli-linux-x86_64.tar.gz sphere-cli install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x86_64
          path: dist/sphere-cli-linux-x86_64.tar.gz

  # ── Build sphere CLI — Linux arm64 ──────────────────────────────────────────
  build-linux-arm64:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf upx-ucl gcc g++

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install cython setuptools wheel pyinstaller
          pip install -e ".[fast]"
          pip install polars pyarrow

      - name: Build CLI binary
        run: bash build.sh

      - name: Package tarball + installer
        run: |
          cd dist
          cp ../install.sh .
          tar -czf sphere-cli-linux-arm64.tar.gz sphere-cli install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-arm64
          path: dist/sphere-cli-linux-arm64.tar.gz

  # ── Publish CLI tarballs to GitHub Release + npm ────────────────────────────
  release:
    needs:
      - check-version
      - build-macos-arm64
      - build-linux-x86_64
      - build-linux-arm64
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: artifacts

      - name: Upload CLI assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          files: |
            artifacts/sphere-cli-macos-arm64.tar.gz
            artifacts/sphere-cli-linux-x86_64.tar.gz
            artifacts/sphere-cli-linux-arm64.tar.gz
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        # SPHERE_SKIP_POSTINSTALL=1 prevents postinstall from downloading
        # the binary we just uploaded (it's not needed in the publish step).
        run: SPHERE_SKIP_POSTINSTALL=1 npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
